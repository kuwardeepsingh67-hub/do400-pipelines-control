apiVersion: apps/v1

kind: Deployment

metadata:

  name: myapp

spec:

  replicas: 2

  selector:

    matchLabels:

      app: myapp

  template:

    metadata:

      labels:

        app: myapp

    spec:

      containers:

        - name: myapp

          image:  quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:f878299355cc517bbf89bfa425c148e0dcb9e2363a437675bc6c3c2c223f811c

          ports:

            - containerPort: 8080
